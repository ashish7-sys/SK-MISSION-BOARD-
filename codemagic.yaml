workflows:
  android-workflow:
    name: SK MISSION BOARD Android Release Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      android_signing:
        - sk_mission_board_keystore
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.skmissionboard.app"
      node: 18
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web application
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android || echo "Capacitor sync step completed"
      - name: Set Gradle permissions
        script: |
          chmod +x gradlew || true
      - name: Build Release APK
        script: |
          ./gradlew assembleRelease || gradle assembleRelease
      - name: Build Release AAB
        script: |
          ./gradlew bundleRelease || gradle bundleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab
